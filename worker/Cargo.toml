[package]
name = "quickloop"
version = "0.1.0"
edition = "2021"
description = "Deterministic PR review, patch, and verification worker for QuickLoop"
license = "Apache-2.0"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "quickloop"
path = "src/main.rs"
